{% extends "base.html" %}

{% block title %}Transferts de Propriété{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row align-items-center mb-4">
      <div class="col-12">
        <h2 class="mb-0"><i class="fas fa-exchange-alt"></i> Transferts de Propriété</h2>
      </div>
    </div>

    <!-- FILTRES -->
    <div class="row mb-4">
      <div class="col-12">
        <div class="card border-0 shadow-sm">
          <div class="card-body">
            <div class="row g-3">
              <div class="col-md-3">
                <label class="form-label">Statut</label>
                <select class="form-select" id="filter-status">
                  <option value="">Tous les statuts</option>
                  <option value="pending">En attente</option>
                  <option value="approved">Approuvé</option>
                  <option value="rejected">Rejeté</option>
                  <option value="completed">Complété</option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label">Plaque d'immatriculation</label>
                <input type="text" class="form-control" id="filter-plate" placeholder="ABC123..." maxlength="20" style="text-transform: uppercase;">
              </div>
              <div class="col-md-3">
                <label class="form-label">Type de transfert</label>
                <select class="form-select" id="filter-type">
                  <option value="">Tous les types</option>
                  <option value="sale">Vente</option>
                  <option value="gift">Don</option>
                  <option value="inheritance">Héritage</option>
                  <option value="other">Autre</option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label">&nbsp;</label>
                <button class="btn btn-primary w-100" id="btn-filter"><i class="fas fa-search me-2"></i>Filtrer</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- TABLEAU DES TRANSFERTS -->
    <div class="card border-0 shadow-sm">
        <div class="card-header bg-light">
            <h5 class="mb-0"><i class="fas fa-list me-2"></i>Liste des transferts</h5>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover mb-0">
                <thead class="table-light">
                  <tr>
                    <th class="ps-4">ID</th>
                    <th>Plaque</th>
                    <th>Type</th>
                    <th>Propriétaire Actuel</th>
                    <th>Nouveau Propriétaire</th>
                    <th>Date Demande</th>
                    <th>Statut</th>
                    <th class="text-end pe-4">Actions</th>
                  </tr>
                </thead>
                <tbody id="transfers-tbody">
                  <tr>
                    <td colspan="8" class="text-center text-muted py-5">
                      <i class="fas fa-spinner fa-spin me-2"></i>Chargement...
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
        </div>
    </div>
</div>

<!-- TRANSFER DETAIL MODAL -->
<div class="modal fade" id="transferModal" tabindex="-1">
  <div class="modal-dialog modal-xl">
    <div class="modal-content border-0 shadow-lg">
      <!-- Header -->
      <div class="modal-header border-0 pb-0 px-4 pt-4" style="background: linear-gradient(135deg, #1a237e 0%, #283593 100%);">
        <div class="w-100">
          <div class="d-flex align-items-center justify-content-between mb-2">
            <h5 class="modal-title text-white fw-bold mb-0">
              <i class="fas fa-exchange-alt me-2"></i>Détails du Transfert
            </h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div id="modal-header-meta" class="pb-3"></div>
        </div>
      </div>
      <!-- Body -->
      <div class="modal-body px-4 py-4" id="transfer-content"></div>
      <!-- Footer -->
      <div class="modal-footer border-top px-4 py-3" id="transfer-actions"></div>
    </div>
  </div>
</div>

<script>
// Initialize
document.addEventListener('DOMContentLoaded', () => {
  loadTransfers();
  document.getElementById('btn-filter').addEventListener('click', loadTransfers);
});

// Load transfers
async function loadTransfers() {
  try {
    const status = document.getElementById('filter-status').value;
    const licensePlate = document.getElementById('filter-plate').value;
    const transferType = document.getElementById('filter-type').value;

    let url = '/api/vehicle-transfers?';
    if (status) url += `status=${status}&`;
    if (licensePlate) url += `license_plate=${licensePlate}&`;
    if (transferType) url += `transfer_type=${transferType}&`;

    console.log('[DEBUG] Fetching transfers from:', url);

    const response = await fetch(url, {
      credentials: 'include',
      headers: {
        'Accept': 'application/json'
      }
    });

    if (!response.ok) {
      console.error(`[DEBUG] HTTP ${response.status}: ${response.statusText}`);
      throw new Error(`HTTP ${response.status}`);
    }

    const transfers = await response.json();
    console.log('[DEBUG] Transfers received:', transfers);

    renderTransfersTable(transfers);
  } catch (error) {
    console.error('[DEBUG] Error loading transfers:', error);
    const tbody = document.getElementById('transfers-tbody');
    tbody.innerHTML = `
      <tr>
        <td colspan="8" class="text-center text-danger py-5">
          <i class="fas fa-exclamation-circle me-2"></i>Erreur: ${error.message}
        </td>
      </tr>
    `;
  }
}

// Render transfers table
function renderTransfersTable(transfers) {
  const tbody = document.getElementById('transfers-tbody');

  if (!transfers || transfers.length === 0) {
    tbody.innerHTML = `
      <tr>
        <td colspan="8" class="text-center text-muted py-5">
          <i class="fas fa-inbox me-2"></i>Aucune soumission trouvée
        </td>
      </tr>
    `;
    return;
  }

  tbody.innerHTML = transfers.map(transfer => `
    <tr style="cursor: pointer;" onclick="showTransferModal(${transfer.id})">
      <td class="ps-4">${transfer.id}</td>
      <td><strong>${transfer.vehicle?.license_plate || 'N/A'}</strong></td>
      <td>
        <span class="badge" style="background-color: ${getTypeColor(transfer.transfer_type)};">
          ${getTypeLabel(transfer.transfer_type)}
        </span>
      </td>
      <td>${transfer.current_owner_name || 'N/A'}</td>
      <td>${transfer.new_owner_name || 'N/A'}</td>
      <td>${formatDate(transfer.created_at)}</td>
      <td>
        <span class="badge" style="background-color: ${getStatusColor(transfer.status)};">
          ${getStatusLabel(transfer.status)}
        </span>
      </td>
      <td class="text-end pe-4">
        <button class="btn btn-sm btn-primary" title="Voir détails" onclick="event.stopPropagation(); showTransferModal(${transfer.id})">
          <i class="fas fa-eye"></i>
        </button>
      </td>
    </tr>
  `).join('');
}

// Show transfer modal
async function showTransferModal(transferId) {
  try {
    const response = await fetch(`/api/vehicle-transfers?id=${transferId}`, { credentials: 'include' });
    if (!response.ok) throw new Error('Failed to fetch transfer');
    const transfers = await response.json();
    const transfer = transfers.find(t => t.id === transferId);
    if (!transfer) { alert('Transfert non trouvé'); return; }

    const isPending = transfer.status === 'pending';
    const ro = isPending ? '' : 'readonly';
    const plate = transfer.vehicle?.license_plate || 'N/A';

    // Header meta
    document.getElementById('modal-header-meta').innerHTML = `
      <div class="d-flex align-items-center gap-2 flex-wrap">
        <span class="badge bg-white text-dark fw-semibold fs-6">
          <i class="fas fa-car me-1"></i>${plate}
        </span>
        <span class="badge" style="background-color:${getTypeColor(transfer.transfer_type)}; font-size:0.85rem;">
          ${getTypeLabel(transfer.transfer_type)}
        </span>
        <span class="badge" style="background-color:${getStatusColor(transfer.status)}; font-size:0.85rem;">
          ${getStatusLabel(transfer.status)}
        </span>
        <span class="text-white-50 small ms-auto">
          <i class="fas fa-calendar-alt me-1"></i>${formatDatetime(transfer.created_at)}
        </span>
      </div>
    `;

    // Body
    let content = `
      <!-- Owners side-by-side -->
      <div class="row g-3 mb-4">

        <!-- Propriétaire actuel -->
        <div class="col-md-6">
          <div class="card h-100 border-0 shadow-sm" style="border-left: 4px solid #1565C0 !important;">
            <div class="card-header border-0 pb-1" style="background:rgba(21,101,192,0.06);">
              <span class="fw-semibold text-primary">
                <i class="fas fa-user me-2"></i>Propriétaire actuel
              </span>
            </div>
            <div class="card-body pt-3">
              <div class="mb-3">
                <label class="form-label small text-muted mb-1">Nom complet</label>
                <input type="text" class="form-control" id="modal-current-owner-name"
                  value="${escapeHtml(transfer.current_owner_name || '')}"
                  placeholder="Nom du propriétaire actuel" ${ro}>
              </div>
              <div class="mb-0">
                <label class="form-label small text-muted mb-1">Téléphone</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fas fa-phone"></i></span>
                  <input type="text" class="form-control" id="modal-current-owner-phone"
                    value="${escapeHtml(transfer.current_owner_phone || '')}"
                    placeholder="Numéro de téléphone" ${ro}>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Nouveau propriétaire -->
        <div class="col-md-6">
          <div class="card h-100 border-0 shadow-sm" style="border-left: 4px solid #2E7D32 !important;">
            <div class="card-header border-0 pb-1" style="background:rgba(46,125,50,0.06);">
              <span class="fw-semibold text-success">
                <i class="fas fa-user-plus me-2"></i>Nouveau propriétaire
              </span>
            </div>
            <div class="card-body pt-3">
              <div class="mb-3">
                <label class="form-label small text-muted mb-1">Nom complet</label>
                <input type="text" class="form-control" id="modal-new-owner-name"
                  value="${escapeHtml(transfer.new_owner_name || '')}"
                  placeholder="Nom du nouveau propriétaire" ${ro}>
              </div>
              <div class="mb-0">
                <label class="form-label small text-muted mb-1">Téléphone</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fas fa-phone"></i></span>
                  <input type="text" class="form-control" id="modal-new-owner-phone"
                    value="${escapeHtml(transfer.new_owner_phone || '')}"
                    placeholder="Numéro de téléphone" ${ro}>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Motif -->
      <div class="card border-0 shadow-sm mb-4">
        <div class="card-header border-0 pb-1" style="background:rgba(0,0,0,0.03);">
          <span class="fw-semibold text-secondary">
            <i class="fas fa-comment-alt me-2"></i>Motif du transfert
          </span>
        </div>
        <div class="card-body pt-3">
          <textarea class="form-control" id="modal-reason" rows="3"
            placeholder="Aucun motif fourni" ${ro}>${escapeHtml(transfer.reason || '')}</textarea>
        </div>
      </div>
    `;

    // Pièce d'identité
    if (transfer.identity_document_path) {
      content += `
        <div class="alert alert-info d-flex align-items-center gap-2 mb-4">
          <i class="fas fa-file-pdf fa-lg"></i>
          <div>
            <strong>Pièce d'identité jointe</strong><br>
            <a href="#" onclick="viewIdentityDocument(${transfer.id}); return false;" class="alert-link">
              Cliquer pour visualiser le document
            </a>
          </div>
        </div>
      `;
    }

    // Notes d'examen (pending only)
    if (isPending) {
      content += `
        <div class="card border-0 shadow-sm mb-3">
          <div class="card-header border-0 pb-1" style="background:rgba(255,193,7,0.08);">
            <span class="fw-semibold" style="color:#856404;">
              <i class="fas fa-clipboard-check me-2"></i>Notes d'examen
            </span>
          </div>
          <div class="card-body pt-3">
            <textarea class="form-control" id="review-notes" rows="2"
              placeholder="Vos notes (optionnel)..."></textarea>
          </div>
        </div>
      `;
    }

    // Traitement info
    if (transfer.processed_by && transfer.processor_username) {
      content += `
        <div class="row g-2 mb-3">
          <div class="col-md-6">
            <div class="p-3 rounded" style="background:rgba(0,0,0,0.04);">
              <div class="small text-muted mb-1"><i class="fas fa-user-shield me-1"></i>Traité par</div>
              <strong>${escapeHtml(transfer.processor_username)}</strong>
            </div>
          </div>
          <div class="col-md-6">
            <div class="p-3 rounded" style="background:rgba(0,0,0,0.04);">
              <div class="small text-muted mb-1"><i class="fas fa-clock me-1"></i>Date de traitement</div>
              <strong>${formatDatetime(transfer.processed_at)}</strong>
            </div>
          </div>
        </div>
      `;
    }

    if (transfer.notes) {
      content += `
        <div class="alert alert-secondary mb-0">
          <strong><i class="fas fa-sticky-note me-1"></i>Notes :</strong> ${escapeHtml(transfer.notes)}
        </div>
      `;
    }

    document.getElementById('transfer-content').innerHTML = content;

    // Footer actions
    let actions = '';
    if (isPending) {
      actions = `
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
          <i class="fas fa-times me-1"></i>Fermer
        </button>
        <button type="button" class="btn btn-primary" onclick="saveTransfer(${transfer.id})">
          <i class="fas fa-save me-1"></i>Enregistrer
        </button>
        <button type="button" class="btn btn-danger" onclick="rejectTransfer(${transfer.id})">
          <i class="fas fa-ban me-1"></i>Rejeter
        </button>
        <button type="button" class="btn btn-success" onclick="approveTransfer(${transfer.id})">
          <i class="fas fa-check me-1"></i>Approuver
        </button>
      `;
    } else {
      actions = `
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          <i class="fas fa-times me-1"></i>Fermer
        </button>
      `;
    }
    document.getElementById('transfer-actions').innerHTML = actions;

    new bootstrap.Modal(document.getElementById('transferModal')).show();
  } catch (error) {
    alert('Erreur: ' + error.message);
  }
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// Save transfer modifications
async function saveTransfer(transferId) {
  const currentOwnerName = document.getElementById('modal-current-owner-name')?.value || '';
  const currentOwnerPhone = document.getElementById('modal-current-owner-phone')?.value || '';
  const newOwnerName = document.getElementById('modal-new-owner-name')?.value || '';
  const newOwnerPhone = document.getElementById('modal-new-owner-phone')?.value || '';
  const reason = document.getElementById('modal-reason')?.value || '';

  if (!newOwnerName.trim()) {
    alert('Veuillez entrer le nom du nouveau propriétaire');
    return;
  }

  if (!newOwnerPhone.trim()) {
    alert('Veuillez entrer le téléphone du nouveau propriétaire');
    return;
  }

  try {
    const response = await fetch(`/api/vehicle-transfers/${transferId}`, {
      method: 'PUT',
      credentials: 'include',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        current_owner_name: currentOwnerName,
        current_owner_phone: currentOwnerPhone,
        new_owner_name: newOwnerName,
        new_owner_phone: newOwnerPhone,
        reason: reason
      })
    });

    const data = await response.json();

    if (!response.ok) {
      alert('Erreur: ' + (data.error || 'Impossible d\'enregistrer les modifications'));
      return;
    }

    alert('Modifications enregistrées avec succès!');
    bootstrap.Modal.getInstance(document.getElementById('transferModal')).hide();
    loadTransfers();
  } catch (error) {
    alert('Erreur: ' + error.message);
  }
}

// View identity document in modal
function viewIdentityDocument(transferId) {
  const docUrl = `/api/vehicle-transfers/${transferId}/identity-document`;
  
  // Create modal for document preview
  const modal = document.createElement('div');
  modal.className = 'modal fade';
  modal.id = 'docModal';
  modal.setAttribute('tabindex', '-1');
  modal.innerHTML = `
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Pièce d'identité</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <iframe src="${docUrl}" style="width: 100%; height: 600px; border: none;"></iframe>
        </div>
        <div class="modal-footer">
          <a href="${docUrl}" class="btn btn-primary" download>
            <i class="fas fa-download me-2"></i> Télécharger
          </a>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
        </div>
      </div>
    </div>
  `;
  
  document.body.appendChild(modal);
  new bootstrap.Modal(modal).show();
  
  // Clean up modal when hidden
  modal.addEventListener('hidden.bs.modal', function() {
    modal.remove();
  });
}

// Approve transfer
async function approveTransfer(transferId) {
  const notes = document.getElementById('review-notes')?.value || '';

  try {
    const response = await fetch('/api/vehicle-transfers/approve', {
      method: 'POST',
      credentials: 'include',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        transfer_id: transferId,
        notes: notes
      })
    });

    const data = await response.json();

    if (!response.ok) {
      alert('Erreur: ' + (data.error || 'Impossible d\'approuver'));
      return;
    }

    alert('Transfert approuvé avec succès!');
    bootstrap.Modal.getInstance(document.getElementById('transferModal')).hide();
    loadTransfers();
  } catch (error) {
    alert('Erreur: ' + error.message);
  }
}

// Reject transfer
async function rejectTransfer(transferId) {
  if (!confirm('Êtes-vous sûr de vouloir rejeter ce transfert?')) return;

  const notes = document.getElementById('review-notes')?.value || '';

  try {
    const response = await fetch('/api/vehicle-transfers/reject', {
      method: 'POST',
      credentials: 'include',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        transfer_id: transferId,
        notes: notes
      })
    });

    const data = await response.json();

    if (!response.ok) {
      alert('Erreur: ' + (data.error || 'Impossible de rejeter'));
      return;
    }

    alert('Transfert rejeté avec succès!');
    bootstrap.Modal.getInstance(document.getElementById('transferModal')).hide();
    loadTransfers();
  } catch (error) {
    alert('Erreur: ' + error.message);
  }
}

// Helper functions
function getTypeColor(type) {
  const colors = {
    'sale': '#FF9800',
    'gift': '#4CAF50',
    'inheritance': '#2196F3',
    'other': '#9C27B0'
  };
  return colors[type] || '#999';
}

function getTypeLabel(type) {
  const labels = {
    'sale': 'Vente',
    'gift': 'Don',
    'inheritance': 'Héritage',
    'other': 'Autre'
  };
  return labels[type] || type;
}

function getStatusColor(status) {
  const colors = {
    'pending': '#FFC107',
    'approved': '#4CAF50',
    'rejected': '#F44336',
    'completed': '#2196F3'
  };
  return colors[status] || '#999';
}

function getStatusLabel(status) {
  const labels = {
    'pending': 'En attente',
    'approved': 'Approuvé',
    'rejected': 'Rejeté',
    'completed': 'Complété'
  };
  return labels[status] || status;
}

function formatDate(dateString) {
  if (!dateString) return 'N/A';
  const date = new Date(dateString);
  return date.toLocaleDateString('fr-FR');
}

function formatDatetime(dateString) {
  if (!dateString) return 'N/A';
  const date = new Date(dateString);
  return date.toLocaleString('fr-FR');
}
</script>
</div>
{% endblock %}

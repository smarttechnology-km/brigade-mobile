<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Attestation d'Assurance</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { background:#f0f0f0; display:flex; flex-direction:column; align-items:center; padding:20px; }
.no-print { text-align:center; margin-bottom:16px; display:flex; gap:8px; }
.no-print button { padding:8px 24px; background:#198754; color:#fff; border:none; border-radius:6px; font-size:14px; cursor:pointer; }
.no-print button.sec { background:#6c757d; }
@media print {
    body { background:#fff; padding:0; }
    .no-print { display:none !important; }
    @page { size: A5 landscape; margin:8mm; }
}
</style>
</head>
<body>
<div class="no-print">
    <button onclick="window.print()">🖨️ Imprimer</button>
    <button class="sec" onclick="window.close()">Fermer</button>
</div>
<div id="card-container"></div>

<script>
const VEHICLE = {{ vehicle_json|safe }};
const TPL     = {{ tpl_json|safe }};
</script>
<script src="{{ url_for('static', filename='js/attestation-builder.js') }}"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('card-container').innerHTML = window.buildAttestationHTML(TPL, VEHICLE);
    setTimeout(() => window.print(), 400);
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Technology — Connexion</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --st-primary: #1a1a2e;
            --st-accent: #16213e;
            --st-blue: #0f3460;
            --st-cyan: #00d4ff;
        }

        body {
            background: linear-gradient(135deg, var(--st-primary) 0%, var(--st-blue) 60%, #0e4d8a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .st-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
        }

        .st-logo {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--st-cyan), #0080ff);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.2rem;
            font-size: 2rem;
            color: #fff;
            box-shadow: 0 8px 24px rgba(0, 212, 255, 0.35);
        }

        .st-title {
            color: #fff;
            font-weight: 700;
            font-size: 1.4rem;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .st-subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.82rem;
            text-align: center;
            margin-bottom: 1.8rem;
        }

        .form-label {
            color: rgba(255, 255, 255, 0.75);
            font-size: 0.85rem;
            font-weight: 500;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(0, 212, 255, 0.25);
            color: #fff;
            border-radius: 10px;
            padding: 0.65rem 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--st-cyan);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.18);
            color: #fff;
            outline: none;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .btn-st {
            background: linear-gradient(135deg, var(--st-cyan), #0080ff);
            border: none;
            color: #fff;
            font-weight: 600;
            border-radius: 10px;
            padding: 0.7rem;
            font-size: 0.95rem;
            letter-spacing: 0.3px;
            transition: opacity 0.2s, transform 0.15s;
        }

        .btn-st:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            color: #fff;
        }

        .back-link {
            color: rgba(255, 255, 255, 0.45);
            font-size: 0.8rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
            justify-content: center;
            margin-top: 1.5rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--st-cyan);
        }

        .alert-danger {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid rgba(220, 53, 69, 0.4);
            color: #ff8090;
            border-radius: 10px;
            font-size: 0.85rem;
        }

        .input-group-text {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(0, 212, 255, 0.25);
            border-right: none;
            color: rgba(255, 255, 255, 0.5);
            border-radius: 10px 0 0 10px;
        }

        .input-group .form-control {
            border-left: none;
            border-radius: 0 10px 10px 0;
        }
    </style>
</head>
<body>
    <div class="st-card">
        <div class="st-logo">
            <i class="fas fa-chart-line"></i>
        </div>
        <div class="st-title">SIGVA Administration</div>
        <div class="st-subtitle">Tableau de bord financier — Accès restreint</div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} mb-3">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="post">
            <div class="mb-3">
                <label class="form-label">Nom d'utilisateur</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user fa-sm"></i></span>
                    <input type="text" class="form-control" name="username" placeholder="Identifiant" required autofocus>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">Mot de passe</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock fa-sm"></i></span>
                    <input type="password" class="form-control" name="password" placeholder="••••••••" required>
                </div>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-st">
                    <i class="fas fa-sign-in-alt me-2"></i>Se connecter
                </button>
            </div>
        </form>

        <a href="{{ url_for('auth.login') }}" class="back-link">
            <i class="fas fa-arrow-left fa-xs"></i> Retour au portail police
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

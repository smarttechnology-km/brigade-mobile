{% extends "base.html" %}
{% block content %}

<div class="container-fluid py-4">

  <div class="d-flex align-items-center justify-content-between mb-4">
    <div>
      <h2 class="mb-0"><i class="fas fa-graduation-cap me-2"></i>Auto-écoles</h2>
      <small class="text-muted">Auto-écoles agréées, rattachées aux dossiers "nouveau permis"</small>
    </div>
    <a href="/dgrtr/auto-ecoles/nouvelle" class="btn btn-primary">
      <i class="fas fa-plus me-2"></i>Nouvelle auto-école
    </a>
  </div>

  <div class="card border-0 shadow-sm mb-3">
    <div class="card-body">
      <input type="text" id="ae-search" class="form-control" placeholder="Rechercher par nom..." style="max-width:360px;" oninput="aeRenderList()">
    </div>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>N° agrément</th>
              <th>Nom</th>
              <th>Île</th>
              <th>Responsable</th>
              <th>Téléphone</th>
              <th>Statut</th>
              <th>Conformité</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="ae-tbody">
            <tr><td colspan="8" class="text-center text-muted py-4">Chargement...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
var AE_CAN_DELETE = {{ (current_user.role == 'administrateur' or current_user.dgrtr_type == 'directeur_general') | tojson }};
var aeAllSchools = [];

document.addEventListener('DOMContentLoaded', aeLoadList);

function aeEsc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function aeLoadList() {
  fetch('/api/auto-ecoles', { credentials: 'same-origin' })
    .then(r => r.json())
    .then(items => { aeAllSchools = Array.isArray(items) ? items : []; aeRenderList(); })
    .catch(() => { document.getElementById('ae-tbody').innerHTML = '<tr><td colspan="8" class="text-center text-danger py-4">Erreur de chargement.</td></tr>'; });
}

function aeRenderList() {
  const q = (document.getElementById('ae-search').value || '').trim().toLowerCase();
  const tbody = document.getElementById('ae-tbody');
  const items = !q ? aeAllSchools : aeAllSchools.filter(a => (a.name || '').toLowerCase().includes(q));

  if (!items.length) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-4">Aucune auto-école trouvée.</td></tr>';
    return;
  }

  tbody.innerHTML = items.map(a => `
    <tr class="ae-row" style="cursor:pointer;" onclick="aeGoToDetail(event, ${a.id})">
      <td class="font-monospace small">${aeEsc(a.agrement_number) || '—'}</td>
      <td class="fw-semibold">${aeEsc(a.name)}</td>
      <td>${aeEsc(a.island) || '—'}</td>
      <td>${aeEsc(a.manager_name) || '—'}</td>
      <td>${aeEsc(a.phone) || '—'}</td>
      <td>${a.is_active ? '<span class="badge bg-success">Active</span>' : '<span class="badge bg-secondary">Inactive</span>'}</td>
      <td>${a.is_conforme ? '<span class="badge bg-success">Conforme</span>' : '<span class="badge bg-danger">Non conforme</span>'}</td>
      <td class="text-end">
        <a class="btn btn-sm btn-outline-primary" href="/dgrtr/auto-ecoles/${a.id}" title="Voir le détail"><i class="fas fa-eye"></i></a>
        <a class="btn btn-sm btn-outline-secondary" href="/dgrtr/auto-ecoles/${a.id}/modifier" title="Modifier"><i class="fas fa-edit"></i></a>
        <button class="btn btn-sm ${a.is_active ? 'btn-outline-warning' : 'btn-outline-success'}" onclick="event.stopPropagation();aeToggleActive(${a.id})" title="${a.is_active ? 'Désactiver' : 'Activer'}">
          <i class="fas fa-${a.is_active ? 'pause' : 'play'}"></i>
        </button>
        ${AE_CAN_DELETE ? `<button class="btn btn-sm btn-outline-danger" onclick="event.stopPropagation();aeDelete(${a.id})" title="Supprimer"><i class="fas fa-trash"></i></button>` : ''}
      </td>
    </tr>
  `).join('');
}

function aeGoToDetail(event, id) {
  if (event.target.closest('a, button')) return;
  window.location.href = '/dgrtr/auto-ecoles/' + id;
}

function aeToggleActive(id) {
  fetch('/api/auto-ecoles/' + id + '/toggle-active', { method: 'POST', credentials: 'same-origin' })
    .then(r => r.json().then(data => ({ ok: r.ok, data })))
    .then(({ ok, data }) => {
      if (!ok) { alert(data.error || 'Erreur'); return; }
      aeLoadList();
    })
    .catch(() => alert('Erreur réseau.'));
}

function aeDelete(id) {
  const ae = aeAllSchools.find(a => a.id === id);
  const name = ae ? ae.name : 'cette auto-école';
  if (!confirm('Supprimer définitivement "' + name + '" ? Cette action est irréversible.')) return;
  fetch('/api/auto-ecoles/' + id, { method: 'DELETE', credentials: 'same-origin' })
    .then(r => r.json().then(data => ({ ok: r.ok, data })))
    .then(({ ok, data }) => {
      if (!ok) { alert(data.error || 'Erreur'); return; }
      aeLoadList();
    })
    .catch(() => alert('Erreur réseau.'));
}
</script>
{% endblock %}
